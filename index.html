<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0866df" />
  <title>Join Vijay Bhai on WhatsApp</title>
  <meta name="description" content="Vijay Bhai ke WhatsApp group se judiye. Join now!" />
  <style>
    *{box-sizing:border-box}
    :root{--blue:#0878ee;--deep:#0754c5;--cyan:#21c8f3;--ink:#24252b}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);overflow-x:hidden;background:radial-gradient(ellipse at 50% 42%,rgba(255,255,255,.22),transparent 48%),repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,255,255,.045) 0deg 9deg,transparent 9deg 18deg),linear-gradient(135deg,#0860d5,#087cf4 55%,#0755c8)}
    .spark{position:fixed;color:#fff;font-size:28px;font-weight:300;line-height:.8;opacity:.9}
    .spark.one{top:7%;left:7%}.spark.two{right:7%;bottom:9%}
    .dots{position:fixed;top:8%;right:7%;width:44px;height:44px;opacity:.9;background-image:radial-gradient(#fff 1.7px,transparent 1.8px);background-size:13px 13px}
    .wrap{width:min(100%,590px);position:relative;padding-top:58px}
    .top-label{position:absolute;z-index:3;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 28px;border-radius:30px;color:#fff;background:#0751ae;letter-spacing:5px;font-size:13px;font-weight:800;box-shadow:0 8px 20px #003d8b44}
    .panel{position:relative;text-align:center;border-radius:36px;padding:104px 28px 38px;background:linear-gradient(145deg,#fff 0%,#e7e7ea 100%);border:7px solid #c5eaff;outline:3px solid #079bea;box-shadow:0 18px 35px #003b8c55,inset 0 2px 8px #fff}
    .avatar{position:absolute;width:154px;height:154px;top:-87px;left:50%;transform:translateX(-50%);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#c7cbd2);border:8px solid #e8edf3;box-shadow:0 9px 18px #0002,inset 0 0 0 8px #c8cdd5}
    .avatar-inner{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#16d879,#079d58);box-shadow:inset 0 4px 12px #005a3444}
    .avatar svg{width:67px;height:67px}
    .eyebrow{margin:4px 0 2px;font-size:19px;color:#34363c}
    h1{margin:0 0 24px;font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-1.5px}
    .name{color:#078f55}
    .sub{margin:0 auto 25px;max-width:390px;color:#555963;font-size:16px;line-height:1.55}
    .join{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;border-radius:22px;color:#fff;text-decoration:none;background:linear-gradient(180deg,#19c978,#079d59);border:4px solid #8fe9c0;box-shadow:0 7px 0 #087a4a,0 12px 20px #007b4b35;font-size:clamp(20px,5vw,25px);font-weight:850;transition:transform .15s,filter .15s}
    .join:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .join:active{transform:translateY(3px);box-shadow:0 3px 0 #087a4a}
    .join.pulse{animation:joinPulse 1.15s ease-in-out infinite;box-shadow:0 0 0 5px #8fe9c088,0 0 24px #12c978aa,0 7px 0 #087a4a}
    @keyframes joinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
    .countdown{margin:18px auto 0;padding:9px 15px;width:max-content;max-width:100%;border-radius:30px;background:#e2fff0;border:1px solid #7cddb0;color:#087a4a;font-size:15px;font-weight:800}
    .countdown strong{font-variant-numeric:tabular-nums;font-size:20px;margin:0 3px}
    .join svg{width:29px;height:29px;flex:none}
    .note{margin:24px 0 0;color:#6b7079;font-size:13px}
    .float-icon{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#49e99b,#079e5a);border:5px solid #8be9bf;box-shadow:0 5px 10px #003b8c44,inset 0 2px 5px #ffffff88}
    .float-icon svg{width:31px;height:31px;fill:white}
    .f1{left:-25px;top:18px}.f2{right:-25px;top:18px}.f3{left:-31px;bottom:48px}.f4{right:-31px;bottom:48px}.f5{left:calc(50% - 31px);bottom:-35px}
    .bottom-label{text-align:center;margin:62px auto 0;width:max-content;max-width:100%;padding:7px 22px;border:1px solid #ffffffaa;border-radius:30px;color:#fff;letter-spacing:3px;font-size:11px;font-weight:750}
    @media(max-width:480px){.wrap{padding-top:52px}.panel{padding:94px 20px 32px;border-radius:28px}.avatar{width:136px;height:136px;top:-76px}.avatar-inner{width:98px;height:98px}.float-icon{width:48px;height:48px;border-width:4px}.float-icon svg{width:24px;height:24px}.f1{left:-18px;top:25px}.f2{right:-18px;top:25px}.f3{left:-21px;bottom:55px}.f4{right:-21px;bottom:55px}.f5{left:calc(50% - 24px);bottom:-28px}.top-label{font-size:11px;letter-spacing:3px;padding:8px 17px}.sub{font-size:14px}}
  </style>
</head>
<body>
  <div class="spark one">＋<br>＋</div><div class="spark two">＋<br>＋</div><div class="dots"></div>
  <main class="wrap">
    <div class="top-label">JOIN OUR COMMUNITY</div>
    <section class="panel">
      <div class="avatar" aria-label="WhatsApp logo"><div class="avatar-inner">
        <svg viewBox="0 0 48 48" role="img" aria-hidden="true"><path fill="white" d="M24 5.5A18 18 0 0 0 8.6 32.8L6 42l9.5-2.5A18 18 0 1 0 24 5.5Zm0 32.7c-2.7 0-5.3-.7-7.5-2.1l-.5-.3-5.6 1.5 1.5-5.4-.4-.6A14.3 14.3 0 1 1 24 38.2Zm7.9-10.7c-.4-.2-2.4-1.2-2.8-1.3-.4-.1-.7-.2-1 .2-.3.4-1.1 1.3-1.4 1.6-.2.3-.5.3-.9.1-.4-.2-1.7-.6-3.3-2-1.2-1-2-2.3-2.2-2.7-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7-.1-.2-.9-2.1-1.3-2.9-.3-.7-.7-.6-.9-.6h-.8c-.3 0-.7.1-1.1.5-.4.4-1.5 1.4-1.5 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.4 7 6.2 1 .4 1.8.7 2.4.8 1 .3 1.9.2 2.6.1.8-.1 2.4-1 2.7-1.9.3-.9.3-1.7.2-1.9-.1-.2-.4-.3-.8-.5Z"/></svg>
      </div></div>
      <div class="float-icon f1"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Z"/></svg></div>
      <div class="float-icon f2"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Z"/></svg></div>
      <div class="float-icon f3"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Z"/></svg></div>
      <div class="float-icon f4"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Z"/></svg></div>
      <div class="float-icon f5"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Z"/></svg></div>
      <p class="eyebrow">Join Us On</p>
      <h1><span class="name">Vijay Bhai</span></h1>
      <p class="sub">Hamare WhatsApp group se judiye aur community ke saath connected rahiye.</p>
      <a class="join" id="joinButton" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2Zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20Z"/></svg>
        JOIN WHATSAPP GROUP
      </a>
      <div class="countdown" id="countdown" aria-live="polite">WhatsApp group opening in <strong id="seconds">10</strong> seconds...</div>
      <p class="note" id="linkStatus">Click the button above to join Vijay Bhai's WhatsApp group.</p>
    </section>
    <div class="bottom-label">CONNECT • SHARE • GROW</div>
    <p style="text-align:center;margin:14px 0 0"><a href="./admin.html" style="color:#ffffffaa;font-size:11px;text-decoration:none">Admin Login</a></p>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const joinButton = document.getElementById("joinButton");
    const linkStatus = document.getElementById("linkStatus");
    const countdownBox = document.getElementById("countdown");
    const secondsText = document.getElementById("seconds");
    let groupLink = "";

    function showSetupMessage(message) {
      countdownBox.textContent = message;
      linkStatus.textContent = "Agar aap admin hain, /admin.html par login karke WhatsApp link save karein.";
      joinButton.addEventListener("click", (event) => {
        if (!groupLink) {
          event.preventDefault();
          linkStatus.textContent = "WhatsApp group link abhi configure nahi hua hai.";
        }
      });
    }

    try {
      if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey === "YOUR_API_KEY") {
        throw new Error("Firebase configuration missing");
      }
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const snap = await getDoc(doc(db, "settings", "landing"));
      groupLink = snap.exists() ? (snap.data().groupLink || "") : "";

      if (!groupLink.startsWith("https://chat.whatsapp.com/")) {
        showSetupMessage("WhatsApp group link abhi set nahi hai.");
      } else {
        joinButton.href = groupLink;
        joinButton.classList.add("pulse");
        let remaining = 10;
        secondsText.textContent = remaining;

        const timer = setInterval(() => {
          remaining -= 1;
          secondsText.textContent = remaining;
          if (remaining <= 0) {
            clearInterval(timer);
            countdownBox.textContent = "WhatsApp group khul raha hai...";
            window.location.href = groupLink;
          }
        }, 1000);

        joinButton.addEventListener("click", () => clearInterval(timer));
      }
    } catch (error) {
      console.error(error);
      showSetupMessage("Website setup pending hai. Admin Firebase setup complete karein.");
    }
  </script>
</body>
</html>
